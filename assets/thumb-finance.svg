<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="fin-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4;stop-opacity:1" /> <!-- light green -->
      <stop offset="100%" style="stop-color:#dcfce7;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fin-bg)" />

  <!-- Graph -->
  <path d="M100 450 L200 400 L300 420 L400 350 L500 300 L600 200 L700 150" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M100 450 L700 450" stroke="#cbd5e1" stroke-width="2" />
  <path d="M100 100 L100 450" stroke="#cbd5e1" stroke-width="2" />

  <!-- Area under graph -->
  <path d="M100 450 L200 400 L300 420 L400 350 L500 300 L600 200 L700 150 V 450 H 100 Z" fill="#10b981" fill-opacity="0.1" />

  <!-- Floating Elements -->
  <circle cx="400" cy="350" r="8" fill="#ffffff" stroke="#10b981" stroke-width="4" />
  <rect x="580" y="160" width="100" height="40" rx="8" fill="white" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))" />
  <text x="630" y="185" font-family="Arial" font-size="16" fill="#10b981" text-anchor="middle" font-weight="bold">+125%</text>

  <!-- Title -->
  <text x="400" y="550" font-family="Arial" font-size="24" fill="#15803d" text-anchor="middle" font-weight="bold">こどもNISA研究所</text>
  <text x="400" y="580" font-family="Arial" font-size="14" fill="#166534" text-anchor="middle">Asset Simulation & Finance Education</text>
</svg>
