<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d3a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg-grad)" />
  
  <!-- Grid Lines -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800" stroke="#373740" stroke-width="1" />
  <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600" stroke="#373740" stroke-width="1" />

  <!-- Abstract Map Nodes -->
  <circle cx="200" cy="200" r="8" fill="#FF8A5B" filter="url(#glow)" />
  <circle cx="350" cy="150" r="12" fill="#FF6B9D" filter="url(#glow)" />
  <circle cx="500" cy="300" r="6" fill="#FF8A5B" filter="url(#glow)" />
  <circle cx="450" cy="400" r="10" fill="#FF6B9D" filter="url(#glow)" />
  
  <!-- Connections -->
  <path d="M200 200 L350 150 L500 300 L450 400" stroke="#FF8A5B" stroke-width="2" stroke-opacity="0.6" />
  <path d="M350 150 L450 400" stroke="#FF6B9D" stroke-width="2" stroke-opacity="0.6" />

  <!-- UI Panel Mockup -->
  <rect x="50" y="50" width="150" height="100" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <rect x="70" y="70" width="80" height="10" rx="2" fill="rgba(255,255,255,0.2)" />
  <rect x="70" y="90" width="60" height="10" rx="2" fill="rgba(255,255,255,0.2)" />
  
  <text x="750" y="550" font-family="Arial" font-size="14" fill="rgba(255,255,255,0.3)" text-anchor="end">Nuclear Grid Sim</text>
</svg>
