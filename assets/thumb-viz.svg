<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="viz-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#viz-grad)" />

  <!-- Japan-ish Silhouette (Abstract) -->
  <path d="M600 100 Q 550 150 500 200 T 400 300 Q 300 400 250 500" stroke="#334155" stroke-width="4" fill="none" />
  
  <!-- Seismic Circles -->
  <circle cx="500" cy="200" r="40" fill="none" stroke="#4facfe" stroke-width="2" opacity="0.8">
    <animate attributeName="r" from="20" to="60" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" from="0.8" to="0" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="500" cy="200" r="10" fill="#00f2fe" />

  <circle cx="400" cy="300" r="25" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.6">
     <animate attributeName="r" from="10" to="40" dur="2.5s" repeatCount="indefinite" />
     <animate attributeName="opacity" from="0.6" to="0" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="400" cy="300" r="6" fill="#f59e0b" />

  <!-- Data Overlay -->
  <rect x="50" y="500" width="700" height="2" fill="#334155" />
  <rect x="50" y="480" width="2" height="40" fill="#334155" />
  <rect x="750" y="480" width="2" height="40" fill="#334155" />
  <circle cx="100" cy="501" r="4" fill="#4facfe" />
  <circle cx="200" cy="501" r="6" fill="#00f2fe" />
  <circle cx="450" cy="501" r="8" fill="#f59e0b" />

  <text x="50" y="50" font-family="Arial" font-size="24" fill="#e2e8f0" font-weight="bold">Seismic JP</text>
  <text x="50" y="80" font-family="Arial" font-size="14" fill="#94a3b8">Real-time Visualization</text>
</svg>
